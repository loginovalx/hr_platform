components:
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: kadry_hr
      description: Самостоятельный хостинг. Закрытое демо использует авторизацию платформы.
    guestCookie:
      type: apiKey
      in: cookie
      name: kadry_guest
      description: Гостевая сессия с доступом к своему подтверждению и чату.
  parameters:
    StaffIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9._-]+$'}
    RecordId:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 140}
  schemas:
    HrNewsItem:
      type: object
      required: [id, title, url, source, topic, publishedAt, read]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        title: {type: string}
        detail: {type: string}
        url: {type: string, format: uri}
        source: {type: string, enum: [mintrud, cbr, hse]}
        topic: {type: string, enum: [regulation, market, skills]}
        publishedAt: {type: string, description: Дата или дата и время публикации в ISO 8601}
        read: {type: boolean}
    OperationsAnalytics:
      type: object
      properties:
        withoutAction: {type: integer, description: Открытые отклики без действия по этапу после регистрации}
        firstAction:
          type: object
          properties:
            samples: {type: integer}
            medianMinutes: {type: [number, 'null']}
        handoffs:
          type: object
          properties:
            waiting: {type: integer}
            overdue: {type: integer}
            answered: {type: integer}
        channels:
          type: array
          items:
            type: object
            properties:
              channel: {type: string}
              received: {type: integer}
              withoutAction: {type: integer}
    ArchiveEvent:
      type: object
      required: [position, note]
      properties:
        position: {type: string, maxLength: 150}
        date: {type: [string, 'null']}
        note: {type: string, maxLength: 1200}
        type: {type: string, enum: [application, interview, decision, other]}
        outcome: {type: string, enum: [hired, rejected, withdrawn, pending]}
        excerpt: {type: string, maxLength: 500}
    RequisitionFields:
      type: object
      required: [title, description]
      properties:
        title: {type: string, maxLength: 150}
        department: {type: string, maxLength: 140}
        description: {type: string, maxLength: 12000}
    Requisition:
      allOf:
      - $ref: '#/components/schemas/RequisitionFields'
      - type: object
        properties:
          id: {type: string}
          status: {type: string, enum: [draft, submitted, vacancy_draft, published]}
          vacancyId: {type: string}
          vacancySlug: {type: string}
    RequisitionPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Requisition'}}
        nextCursor: {type: [string, 'null']}
    HandoffBrief:
      type: object
      required: [fullName, vacancyTitle, criteria]
      properties:
        fullName: {type: string}
        vacancyTitle: {type: string}
        criteria:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              reference: {type: string}
              status: {type: string, enum: [matched, partial, needs_clarification, not_met]}
              question: {type: [string, 'null']}
              reviewReason: {type: [string, 'null']}
    InterviewNote:
      type: object
      properties:
        sourceId: {type: string}
        criterionId: {type: [string, 'null']}
        question: {type: string}
        text: {type: string}
        nextStep: {type: string}
        actorName: {type: string}
        recordedAt: {type: string, format: date-time}
    InterviewPlanQuestion:
      type: object
      required: [criterionId, label, question, reason]
      properties:
        criterionId: {type: string}
        label: {type: string}
        question: {type: string}
        reason: {type: string, enum: [required_gap, optional_gap, verify_evidence, opening]}
        evidence:
          anyOf:
          - $ref: '#/components/schemas/InterviewEvidence'
          - type: 'null'
        source: {type: string, enum: [local, model]}
    InterviewEvidence:
      type: object
      required: [sourceId, type, quote, offset]
      properties:
        sourceId: {type: string}
        type: {type: string, enum: [resume, test, clarification, interview]}
        quote: {type: string}
        offset: {type: integer, minimum: 0}
    ReviewProgress:
      type: object
      required: [required, withEvidence, confirmed]
      properties:
        required: {type: integer, minimum: 0}
        withEvidence: {type: integer, minimum: 0}
        confirmed: {type: integer, minimum: 0}
    ArchiveDocument:
      type: object
      properties:
        documentId: {type: string}
        title: {type: string, maxLength: 180}
        text: {type: string, maxLength: 20000}
        sourceAccount: {type: string, maxLength: 160}
        deliveryId: {type: [string, 'null'], maxLength: 250}
        addedAt: {type: string, format: date-time}
        addedBy: {type: string}
        attachment: {type: [object, 'null']}
        education: {type: string}
        additionalEducation: {type: string}
        events:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ArchiveEvent'
    IntakeTriageStatus:
      type: string
      enum: [review_first, clarify, check_source, confirmed_gap, manual_review, processing, closed]
    IntakeTriage:
      type: object
      required: [status, reason]
      properties:
        status:
          $ref: '#/components/schemas/IntakeTriageStatus'
        reason:
          type: string
          enum: [finished, hr_confirmed_gap, missing_source, unreadable_attachment, missing_text, missing_contact,
            analysis_pending, analysis_unavailable, no_required_criteria, required_supported, required_need_evidence, test_incomplete]
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
      required:
      - code
      - message
      - fields
