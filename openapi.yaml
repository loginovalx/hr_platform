openapi: 3.1.0
info:
  title: Кадры · Горький
  version: 1.0.0
  description: Контракт муниципального подбора. Идентификаторы непрозрачные. Даты ISO 8601. Для PDF, DOCX и TXT до 5 МБ используйте
    multipart/form-data. В этом формате answers — JSON-строка.
servers:
- url: /api/v1
tags:
- name: Доступ
- name: Вакансии
- name: Отклики
- name: Кандидаты
- name: Этапы
- name: Анкеты
- name: Аналитика
paths:
  /auth/session:
    get:
      tags:
      - Доступ
      summary: Текущий пользователь
      operationId: get_auth_session
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  actor:
                    anyOf:
                    - type: object
                      properties:
                        name:
                          type: string
                        role:
                          type: string
                          enum:
                          - admin
                          - hr
                        hosted:
                          type: boolean
                    - type: 'null'
                  demoAvailable:
                    type: boolean
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
      - Доступ
      summary: Вход в кабинет
      operationId: post_auth_login
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  role:
                    type: string
                    enum:
                    - admin
                    - hr
                  name:
                    type: string
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  maxLength: 80
                password:
                  type: string
                  maxLength: 256
              required:
              - user
  /auth/logout:
    post:
      tags:
      - Доступ
      summary: Выход из кабинета
      operationId: post_auth_logout
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /public/session:
    get:
      tags:
      - Доступ
      summary: Создать гостевую сессию
      operationId: get_public_session
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/vacancies:
    get:
      tags:
      - Вакансии
      summary: Опубликованные вакансии
      operationId: get_public_vacancies
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        vacancyId:
                          type: string
                          maxLength: 140
                        slug:
                          type: string
                          maxLength: 90
                        title:
                          type: string
                          maxLength: 150
                        department:
                          type: string
                          maxLength: 140
                        location:
                          type: string
                          maxLength: 120
                        schedule:
                          type: string
                          maxLength: 80
                        description:
                          type: string
                        hasTest:
                          type: boolean
                    maxItems: 50
                  nextCursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - items
                - nextCursor
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 24
      - name: cursor
        in: query
        schema:
          type: string
  /public/vacancies/{slug}:
    get:
      tags:
      - Вакансии
      summary: Опубликованная версия вакансии
      operationId: get_public_vacancies_slug
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  vacancyId:
                    type: string
                    maxLength: 140
                  slug:
                    type: string
                    maxLength: 90
                  title:
                    type: string
                    maxLength: 150
                  department:
                    type: string
                    maxLength: 140
                  location:
                    type: string
                    maxLength: 120
                  schedule:
                    type: string
                    maxLength: 80
                  description:
                    type: string
                  publishedVersionId:
                    type: string
                    maxLength: 140
                  formFields:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          enum:
                          - fullName
                          - contact
                          - resume
                        label:
                          type: string
                        required:
                          type: boolean
                      required:
                      - id
                      - required
                  testVersionId:
                    anyOf:
                    - type: string
                      maxLength: 140
                    - type: 'null'
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 140
                        text:
                          type: string
                          maxLength: 400
                        required:
                          type: boolean
                      required:
                      - text
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
  /public/applications:
    post:
      tags:
      - Отклики
      summary: Гостевой отклик
      operationId: post_public_applications
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    maxLength: 140
                  receiptNumber:
                    type: string
                  assessmentStatus:
                    type: string
                    enum:
                    - pending
                    - ready
                    - failed
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vacancyId:
                  type: string
                  maxLength: 140
                fullName:
                  type: string
                  maxLength: 160
                contact:
                  type: string
                  maxLength: 254
                  format: email
                resumeText:
                  type: string
                  maxLength: 20000
                publishedVersionId:
                  type: string
                  maxLength: 140
                testVersionId:
                  type: string
                  maxLength: 140
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId:
                        type: string
                        maxLength: 140
                      value:
                        type: string
                        maxLength: 2000
                    required:
                    - questionId
                    - value
                  maxItems: 6
              required:
              - vacancyId
              - publishedVersionId
              - fullName
              - contact
          multipart/form-data:
            schema:
              type: object
              properties:
                vacancyId:
                  type: string
                  maxLength: 140
                fullName:
                  type: string
                  maxLength: 160
                contact:
                  type: string
                  maxLength: 254
                  format: email
                resumeText:
                  type: string
                  maxLength: 20000
                publishedVersionId:
                  type: string
                  maxLength: 140
                testVersionId:
                  type: string
                  maxLength: 140
                answers:
                  type: string
                resumeFile:
                  type: string
                  format: binary
              required:
              - vacancyId
              - publishedVersionId
              - fullName
              - contact
  /public/receipts/{receiptNumber}:
    get:
      tags:
      - Отклики
      summary: Подтверждение и статус локального разбора
      operationId: get_public_receipts_receiptNumber
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptNumber:
                    type: string
                    maxLength: 140
                  assessmentStatus:
                    type: string
                    enum:
                    - pending
                    - ready
                    - failed
                  clarificationThreadId:
                    anyOf:
                    - type: string
                      maxLength: 140
                    - type: 'null'
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - guestCookie: []
      parameters:
      - name: receiptNumber
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
  /public/clarifications/{threadId}:
    get:
      tags:
      - Отклики
      summary: Вопросы чата уточнений
      operationId: get_public_clarifications_threadId
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  threadId:
                    type: string
                    maxLength: 140
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                          maxLength: 140
                        text:
                          type: string
                        status:
                          type: string
                          enum:
                          - open
                          - answered
                        answer:
                          type: string
                        criterionId:
                          type: string
                          maxLength: 140
                    maxItems: 8
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - guestCookie: []
      parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
  /public/clarifications/{threadId}/answers:
    post:
      tags:
      - Отклики
      summary: Сохранить ответы кандидата
      operationId: post_public_clarifications_threadId_answers
      responses:
        '202':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - guestCookie: []
      parameters:
      - name: threadId
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId:
                        type: string
                        maxLength: 140
                      text:
                        type: string
                        maxLength: 2000
                    required:
                    - questionId
                    - text
                  maxItems: 8
              required:
              - answers
  /public/clarification-sessions:
    post:
      tags:
      - Отклики
      summary: Обменять одноразовую ссылку на гостевую сессию
      operationId: post_public_clarification_sessions
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  threadId:
                    type: string
                    maxLength: 140
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
  /public/surveys/{token}:
    get:
      tags:
      - Анкеты
      summary: Открыть анкету по ссылке
      operationId: get_public_surveys_token
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - interview_feedback
                    - exit_feedback
                  title:
                    type: string
                  audience:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          maxLength: 140
                        text:
                          type: string
                        type:
                          type: string
                          enum:
                          - rating
                          - text
                        required:
                          type: boolean
                    maxItems: 3
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
  /public/surveys/{token}/responses:
    post:
      tags:
      - Анкеты
      summary: Сохранить единственный ответ на анкету
      operationId: post_public_surveys_token_responses
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseId:
                    type: string
                    maxLength: 140
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 140
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      questionId:
                        type: string
                        maxLength: 140
                      value:
                        oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 5
                        - type: string
                          maxLength: 1200
                    required:
                    - questionId
                    - value
                  maxItems: 3
              required:
              - answers
  /hr/vacancies:
    get:
      tags:
      - Вакансии
      summary: Список вакансий HR
      operationId: get_hr_vacancies
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        vacancyId:
                          type: string
                          maxLength: 140
                        slug:
                          type: string
                          maxLength: 90
                        title:
                          type: string
                          maxLength: 150
                        department:
                          type: string
                          maxLength: 140
                        location:
                          type: string
                          maxLength: 120
                        schedule:
                          type: string
                          maxLength: 80
                        status:
                          type: string
                          enum:
                          - published
                          - draft
                        publishedVersionId:
                          anyOf:
                          - type: string
                            maxLength: 140
                          - type: 'null'
                        updatedAt:
                          type: string
                          format: date-time
                    maxItems: 50
                  nextCursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - items
                - nextCursor
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffCookie: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 24
      - name: cursor
        in: query
        schema:
          type: string
    post:
      tags:
      - Вакансии
      summary: Создать черновик
      operationId: post_hr_vacancies
      responses:
        '201':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  vacancyId:
                    type: string
                    maxLength: 140
                  slug:
                    type: string
                    maxLength: 90
                  title:
                    type: string
                    maxLength: 150
                  department:
                    type: string
                    maxLength: 140
                  location:
                    type: string
                    maxLength: 120
                  schedule:
                    type: string
                    maxLength: 80
                  status:
                    type: string
                    enum:
                    - published
                    - draft
                  publishedVersionId:
                    anyOf:
                    - type: string
                      maxLength: 140
                    - type: 'null'
                  updatedAt:
                    type: string
                    format: date-time
                  draft:
                    type: object
                    properties:
                      slug:
                        type: string
                        maxLength: 90
                      title:
                        type: string
                        maxLength: 150
                      department:
                        type: string
                        maxLength: 140
                      location:
                        type: string
                        maxLength: 120
                      schedule:
                        type: string
                        maxLength: 80
                      description:
                        type: string
                        maxLength: 12000
                      formFields:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              enum:
                              - fullName
                              - contact
                              - resume
                            label:
                              type: string
                            required:
                              type: boolean
                          required:
                          - id
                          - required
                        maxItems: 8
                      criteria:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              maxLength: 140
                            label:
                              type: string
                              maxLength: 160
                            code:
                              type: string
                              enum:
                              - custom
                              - sql
                              - python
                              - analytics
                              - api
                              - communication
                              - education
                              - project
                              - office
                              - experience
                            keywords:
                              type: array
                              items:
                                type: string
                                maxLength: 70
                              maxItems: 12
                            required:
                              type: boolean
                            question:
                              type: string
                              maxLength: 300
                          required:
                          - label
                        maxItems: 8
                      testQuestions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              maxLength: 140
                            text:
                              type: string
                              maxLength: 400
                            required:
                              type: boolean
                          required:
                          - text
                        maxItems: 6
                    required:
                    - title
                    - department
                    - description
                    - slug
        default:
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - staffCookie: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  maxLength: 90
                title:
                  type: string
                  maxLength: 150
                department:
                  type: string
                  maxLength: 140
                location:
                  type: string
                  maxLength: 120
                schedule:
                  type: string
                  maxLength: 80
                description:
                  type: string
                  maxLength: 12000
                formFields:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        enum:
                        - fullName
                        - contact
                        - resume
                      label:
                        type: string
                      required:
                        type: boolean
                    required:
                    - id
                    - required
                  maxItems: 8
                criteria:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 140
                      label:
                        type: string
                        maxLength: 160
                      code:
                        type: string
                        enum:
                        - custom
                        - sql
                        - python
                        - analytics
                        - api
                        - communication
                        - education
                        - project
                        - office
                        - experience
                      keywords:
                        type: array
                        items:
                          type: string
                          maxLength: 70
                        maxItems: 12
                      required:
                        type: boolean
                      question:
                        type: string
                        maxLength: 300
                    required:
                    - label
                  maxItems: 8
                testQuestions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 140
                      text:
                        type: string
                        maxLength: 400
                      required:
                        type: boolean
                    required:
                    - text
                  maxItems: 6
              required:
              - title
              - department
              - description
              - slug
  /hr/vacancies/{id}:
    get:
      tags:
      - Вакансии
      summary: Открыть черновик вакансии
      operationId: get_hr_vacancies_id
      responses:
        '200':
          description: Успешный результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  vacancyId:
                    type: string
                    maxLength: 140
                  slug:
                    type: string
                    maxLength: 90
                  title:
                    type: string
                    maxLength: 150
                  department:
                    type: string
                    maxLength: 140
                  location:
                    type: string
                    maxLength: 120
                  schedule:
                    type: string
                    maxLength: 80
                  status:
                    type: string
                    enum:
                    - published
                    - draft
                  publishedVersionId:
                    anyOf:
                    - type: string
                      maxLength: 140
                    - type: 'null'
                  updatedAt:
                    type: string
                    format: date-time
                  draft:
                    type: object
                    properties:
                      slug:
                        type: string
                        maxLength: 90
                      title:
                        type: string
                        maxLength: 150
                      department:
                        type: string
                        maxLength: 140
                      location:
                        type: string
                        maxLength: 120
                      schedule:
                        type: string
                        maxLength: 80
                      description:
                        type: string
                        maxLength: 12000
                      formFields:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              enum:
                              - fullName
                              - contact
                              - resume
                            label:
                              type: string
                            required:
                              type: boolean
                          required:
                          - id
                          - required
                        maxItems: 8
                      criteria:
                        type: array
