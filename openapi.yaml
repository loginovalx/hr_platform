components:
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: kadry_hr
      description: Самостоятельный хостинг. Закрытое демо использует авторизацию платформы.
    guestCookie:
      type: apiKey
      in: cookie
      name: kadry_guest
      description: Гостевая сессия с доступом к своему подтверждению и чату.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
      required:
      - code
      - message
      - fields
